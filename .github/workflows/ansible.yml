name: "Ansible deploy & Java install"

on: 
  workflow_run:
    workflows: [Terraform Plan & Apply]
    types: completed

permissions:
  id-token: write
  contents: read

jobs: 
  ansible-deploy:
    name: Ansible deploy
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Chcekout
        uses: actions/checkout@v4

      # 1. 前のWorkflowで作られたinventory.iniをダウンロード
      - name: Download inventory
        uses: actions/download-artifact@v5
        with:
          name: ansible-inventory
          path: ansible/inventory/ # ansibleフォルダの中に配置
          # 別のWorkflowから取得するための設定
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: check inventory
        run: cat ansible/inventory/inventory.ini

      # 2. AWS認証 (SSM接続に必要)    
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ap-northeast-1
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
      
      # 3. 実行環境のセットアップ
      - name: Install Ansible and AWS collection
        run: |
         pip install ansible botocore boto3
         ansible-galaxy collection install amazon.aws --collections-path ~/.ansible/collections

      # 4。SSM経由で接続するための設定
      - name: Install Session Manager Plugin
        run: |
          curl "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb" -o "session-manager-plugin.deb"
          sudo dpkg -i session-manager-plugin.deb

      - name: check caller identity
        run: aws sts get-caller-identity

      - name: check env
        run: env | egrep 'AWS|AWS_' || true

      - name: check ssm run
        run: |
          ansible -i inventory/inventory.ini web_servers -m raw -a 'bash -lc "echo HELLO; 
          echo $HOME; whoami"' -c aws_ssm -vvv || true
      
      - name: ansible play log
        working-directory: ansible
        run: |
          ansible-playbook -i inventory/inventory.ini playbooks/playbook.yml -vvvv 
          > /tmp/ansible_ssm_play.log 2>&1 || true
      
      - name: check ssm log
        run: |
          aws ssm list-command-invocations --instance-id i-076c36398b05e7350 
          --details --region ap-northeast-1 > /tmp/ssm_invocations.json
      
      - name: command id
        run: |
          cmdid=$(aws ssm list-command-invocations --instance-id i-076c36398b05e7350 
          --details --region ap-northeast-1 --query 'CommandInvocations[0].CommandId' --output text)
      
      - name: check command id log
        run: |
          aws ssm get-command-invocation --instance-id i-076c36398b05e7350 --command-id $cmdid 
          --region ap-northeast-1 > /tmp/ssm_invocation_detail.json || true

      # 5. Ansible実行    
      - name: Run Playbook
        working-directory: ansible
        env:
          ANSIBLE_CONFIG: ${{ github.workspace }}/ansible/ansible.cfg
          AWS_REGION: ap-northeast-1          # 追加
          AWS_DEFAULT_REGION: ap-northeast-1  # 念のため追加
        run: |
         ansible --version
         ansible-playbook playbooks/playbook.yml -vvv
