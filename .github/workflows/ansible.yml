name: "Ansible deploy & Java install"

on: 
  workflow_run:
    workflows: [Terraform Plan & Apply]
    types: completed

permissions:
  id-token: write
  contents: read

jobs: 
  ansible-deploy:
    name: Ansible deploy
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Chcekout
        uses: actions/checkout@v4

      # 1. 前のWorkflowで作られたinventory.iniをダウンロード
      - name: Download inventory
        uses: actions/download-artifact@v5
        with:
          name: ansible-inventory
          path: ansible/inventory/ # ansibleフォルダの中に配置
          # 別のWorkflowから取得するための設定
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: check inventory
        run: cat ansible/inventory/inventory.ini

      # 2. AWS認証 (SSM接続に必要)    
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ap-northeast-1
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
      
      # 3. 実行環境のセットアップ
      - name: Install Ansible and AWS collection
        run: |
         pip install ansible botocore boto3
         ansible-galaxy collection install amazon.aws --collections-path ~/.ansible/collections

      # 4。SSM経由で接続するための設定
      - name: Install Session Manager Plugin
        run: |
          curl "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb" -o "session-manager-plugin.deb"
          sudo dpkg -i session-manager-plugin.deb

      - name: check runner
        run: aws sts get-caller-identity

      - name: echo hello
        working-directory: ansible
        run: ansible -i inventory/inventory.ini web_servers -m raw -a 'echo hello' -c aws_ssm -vvv
      
      - name: list command 
        run: aws ssm list-command-invocations --instance-id i-076c36398b05e7350 --details --region ap-northeast-1

      - name: ansible play log
        run: ansible-playbook -i inventory/inventory.ini playbooks/playbook.yml -vvvv

      - name: check creds
        run: env | egrep 'AWS|AWS' || true

      # 5. Ansible実行    
      - name: Run Playbook
        working-directory: ansible
        env:
          ANSIBLE_CONFIG: ${{ github.workspace }}/ansible/ansible.cfg
        run: |
         ansible --version
         ansible-playbook playbooks/playbook.yml -vvv
