# ワークフローの名前
name: 'Terraform Plan & Apply'

# terraform planとapplyを実行するきっかけ
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**.drawio.svg'
      - '**.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.drawio.svg'
      - '**.md'

#  OIDC認証のための必要な権限設定
permissions:
  id-token: write
  contents: read
  # PRにコメントを書くために必要
  pull-requests: write

# 実行される具体的な処理
jobs:
  # --- Planジョブ：PR時とマージ時の両方で動く ---
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # AWS認証: OIDCを使用して一時的な認証情報を取得
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ap-northeast-1
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.3
          terraform_wrapper: true # 出力をキャプチャするために必須（デフォルトtrue）
      
      - name: Terraform Init
        run: terraform init
      
      - name: Terraform Validate
        run: terraform validate
      
      - name: Terraform Format
        run: terraform fmt -check || true # フォーマットエラーでも止まらないように設定

      - name: Create terraform.tfvars
        run: |
          cat <<EOF > terraform.tfvars
          key_pair_name = "${{ secrets.KEY_PAIR_NAME }}" 
          CidrIp_From_Internet = "${{ secrets.CIDRIP_FROM_INTERNET }}"
          RDS_Master_User_Name = "${{ secrets.RDS_MASTER_USER_NAME }}"
          RDS_Master_User_Password = "${{ secrets.RDS_MASTER_USER_PASSWORD }}"
          My_Email_Address = "${{ secrets.MY_EMAIL_ADDRESS }}"
          EOF

      - name: Terraform Test
        id: test
        run: terraform test -var-file=terraform.tfvars -no-color # コメントが読みやすいよう色コードを消す
         # Testが失敗しても、コメント投稿まで進ませる
        continue-on-error: true

      - name: Terraform Plan
        id: plan
        run: terraform plan -input=false -no-color # コメントが読みやすいよう色コードを消す
        # Planが失敗しても、コメント投稿まで進ませる
        continue-on-error: true
      
      # PRの場合のみ、テスト結果とPlan結果をコメント投稿する
      - name: Update Pull Request
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // テストの結果によって絵文字を変える
            const testStatus = "${{ steps.test.outcome }}" === "success" ? "✅ Pass" : "❌ Failed";
            const testOutput = process.env.TEST_OUT;
            const planOutput = process.env.PLAN_OUT;

            const output = `#### Terraform Test Result: ${testStatus}
            <details><summary>Show Test Logs</summary>

            \`\`\`text
            ${testOutput}
            \`\`\`

            </details>

            #### Terraform Plan 📖
            <details><summary>Show Plan</summary>

            \`\`\`terraform
            ${planOutput}
            \`\`\`

            </details>

            *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })
        env:
          TEST_OUT: "${{ steps.test.outputs.stdout }}"
          PLAN_OUT: "${{ steps.plan.outputs.stdout }}"

      # 最後に、テストかプランのどちらかが失敗していたらジョブ自体を「失敗」扱いにする
      - name: Fail if test or plan failed
        if: steps.test.outcome == 'failure' || steps.plan.outcome == 'failure'
        run: exit 1

  # --- Applyジョブ：mainへのマージ（push）時のみ動く ---
  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    # terraform-planが成功したときだけ実行される依存関係
    needs: terraform-plan  
    # mainブランチへのpush（マージ）時のみ実行する条件
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # AWS認証: OIDCを使用して一時的な認証情報を取得
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ap-northeast-1
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.3
      
      - name: Terraform Init
        run: terraform init

      - name: Create terraform.tfvars
        run: |
          cat <<EOF > terraform.tfvars
          key_pair_name = "${{ secrets.KEY_PAIR_NAME }}" 
          CidrIp_From_Internet = "${{ secrets.CIDRIP_FROM_INTERNET }}"
          RDS_Master_User_Name = "${{ secrets.RDS_MASTER_USER_NAME }}"
          RDS_Master_User_Password = "${{ secrets.RDS_MASTER_USER_PASSWORD }}"
          My_Email_Address = "${{ secrets.MY_EMAIL_ADDRESS }}"
          EOF

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false
    
      - name: Upload inventory
        uses: actions/upload-artifact@v4
        with:
          name: ansible-inventory
          path: ansible/inventory/inventory.ini  # Terraformのlocal_fileで作ったパスを指定